[package]
name = "app"
version = "0.7.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
notify = "6.1"
tokio = { version = "1", features = ["sync", "time"] }

# macOS Dock 右键菜单（applicationDockMenu:）——版本与 tao 0.34 对齐，避免双主版本
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
    "NSObject",
    "NSString",
    "NSURL",
    "NSDictionary",
    "NSArray",
] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }
objc2-pdf-kit = { version = "0.3", features = [
    "PDFDocument",
    "PDFOutline",
    "PDFDestination",
    "PDFSelection",
    "PDFPage",
] }
unicode-normalization = "0.1"

# Windows PDF 直存（WebView2 ICoreWebView2_7::PrintToPdf）——版本与 wry 0.54 对齐
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
