name: Feature Request / 功能建议
description: Suggest an idea for VividMark (Chinese or English both fine / 中英文均可)
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve? / 解决什么问题
      description: Describe the pain point or use case. / 描述痛点或使用场景。
      placeholder: When writing ..., I need ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 期望的方案
      placeholder: It would be great if ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
      description: How do other editors (Typora, Obsidian, MarkText...) handle this? / 其他编辑器（Typora、Obsidian、MarkText 等）是如何做的？
    validations:
      required: false
