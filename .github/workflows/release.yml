name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Apple notarization key (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          KEY_PATH="$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VividMark ${{ github.ref_name }}'
          releaseBody: |
            ## VividMark ${{ github.ref_name }}

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | macOS | `VividMark_*.dmg` |
            | Windows | `VividMark_*_x64-setup.exe` |
            | Linux | `VividMark_*_amd64.deb` / `.AppImage` |
            | UOS 20 / deepin (玲珑, arm64) | `com.vividmark.app_*_arm64_binary.layer`（老设备 `ll-cli install`）/ `com.vividmark.app_*.uab`（新系统双击安装） |
          releaseDraft: true
          prerelease: false

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name 'VividMark.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2>&1 | tee "$RUNNER_TEMP/vividmark-codesign.txt"
          grep -F "Authority=$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/vividmark-codesign.txt"
          grep -E 'flags=.*\(runtime\)' "$RUNNER_TEMP/vividmark-codesign.txt"
          spctl -a -vv -t exec "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

  # 玲珑（Linglong）打包：面向 UOS 20 等老系统的 arm64 交付路径，见 linglong/README.md。
  # 构建全程在玲珑容器（Deepin 23 base）内进行，不依赖 runner 上的 Node/Rust。
  build-linglong:
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install linglong toolchain
        run: |
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linglong-builder linglong-box
          # Ubuntu 24.04 默认用 AppArmor 限制非特权 user namespace，ll-box 需要放开
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ll-builder --version

      # 玲珑包版本与 tag 对齐（不足 4 段补 0，如 v0.8.0 → 0.8.0.0）
      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          while [ "$(awk -F. '{print NF}' <<<"$TAG")" -lt 4 ]; do TAG="$TAG.0"; done
          sed -i "s/^  version: .*/  version: $TAG/" linglong.yaml
          grep -A3 '^package:' linglong.yaml

      # 缓存玲珑 base 镜像（org.deepin.base ~1GB+），避免每次重新拉取
      - name: Cache linglong base image
        uses: actions/cache@v6
        with:
          path: ~/.cache/linglong-builder
          key: linglong-builder-${{ runner.arch }}-${{ hashFiles('linglong.yaml') }}
          restore-keys: |
            linglong-builder-${{ runner.arch }}-

      - name: Build linglong package
        run: ll-builder build

      - name: Export layer
        run: ll-builder export --layer

      # UAB 离线包：面向新系统双击安装/市场上架；老设备（玲珑 1.5.6）用 .layer
      - name: Export UAB
        run: ll-builder export

      - name: Upload layer artifact
        uses: actions/upload-artifact@v7
        with:
          name: vividmark-linglong-arm64
          path: |
            ./*.layer
            ./*.uab

      - name: Attach layer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          # 只挂面向用户的 binary layer + uab；develop layer（调试 shell 模块）不进 release
          files: |
            ./com.vividmark.app_*_binary.layer
            ./*.uab
