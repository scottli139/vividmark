name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VividMark ${{ github.ref_name }}'
          releaseBody: |
            ## VividMark ${{ github.ref_name }}

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | macOS | `VividMark_*.dmg` |
            | Windows | `VividMark_*_x64-setup.exe` |
            | Linux | `VividMark_*_amd64.deb` / `.AppImage` |
            | UOS 20 / deepin (玲珑, arm64) | `com.vividmark.app_*_arm64_binary.layer`（老设备 `ll-cli install`）/ `com.vividmark.app_*.uab`（新系统双击安装） |
          releaseDraft: true
          prerelease: false

  # 玲珑（Linglong）打包：面向 UOS 20 等老系统的 arm64 交付路径，见 linglong/README.md。
  # 构建全程在玲珑容器（Deepin 23 base）内进行，不依赖 runner 上的 Node/Rust。
  build-linglong:
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install linglong toolchain
        run: |
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linglong-builder linglong-box
          # Ubuntu 24.04 默认用 AppArmor 限制非特权 user namespace，ll-box 需要放开
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ll-builder --version

      # 玲珑包版本与 tag 对齐（不足 4 段补 0，如 v0.8.0 → 0.8.0.0）
      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          while [ "$(awk -F. '{print NF}' <<<"$TAG")" -lt 4 ]; do TAG="$TAG.0"; done
          sed -i "s/^  version: .*/  version: $TAG/" linglong.yaml
          grep -A3 '^package:' linglong.yaml

      # 缓存玲珑 base 镜像（org.deepin.base ~1GB+），避免每次重新拉取
      - name: Cache linglong base image
        uses: actions/cache@v6
        with:
          path: ~/.cache/linglong-builder
          key: linglong-builder-${{ runner.arch }}-${{ hashFiles('linglong.yaml') }}
          restore-keys: |
            linglong-builder-${{ runner.arch }}-

      - name: Build linglong package
        run: ll-builder build

      - name: Export layer
        run: ll-builder export --layer

      # UAB 离线包：面向新系统双击安装/市场上架；老设备（玲珑 1.5.6）用 .layer
      - name: Export UAB
        run: ll-builder export

      - name: Upload layer artifact
        uses: actions/upload-artifact@v7
        with:
          name: vividmark-linglong-arm64
          path: |
            ./*.layer
            ./*.uab

      - name: Attach layer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ./*.layer
            ./*.uab
